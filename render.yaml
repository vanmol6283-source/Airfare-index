services:
  - type: web
    name: apix-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./airfare_index.db
      - key: APP_DEBUG
        value: "false"
      - key: SCRAPING_ENABLED
        value: "false"
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
