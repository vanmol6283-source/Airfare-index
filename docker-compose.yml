version: "3.9"

services:
  # ── Python FastAPI Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apix_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - apix_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/airfare_index.db
      - DEBUG=false
      - SCRAPING_ENABLED=false
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:80"]
    command: >
      sh -c "python seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React + Vite Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./airfare-index
      dockerfile: Dockerfile
    container_name: apix_frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  apix_data:
